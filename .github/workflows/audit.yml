name: 🛡️ Specter CI & API Contract Audit

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Estándar GitHub 2026 / OpenSSF Scorecard: Cero permisos globales por defecto
permissions: {}

# Cancela ejecuciones redundantes en la misma rama o PR (FinOps)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Rust Quality, Contract Diff, SARIF & CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & E2E integration tests (20 tests)
        run: cargo test --verbose

      - name: Build optimized release binary (stripped + LTO)
        run: cargo build --release --locked

      - name: Run GLASTOR® Byte-Gauge SIMD Binary & Hardening Audit
        id: byte-gauge-audit
        uses: glastor-core/byte-gauge@v1
        with:
          file-path: "./target/release/specter"
          max-size-mb: "10.0"
          fail-on-debug: "true"
          scan-entropy-secrets: "true"
          output-json: ".byte-gauge/byte-gauge-audit.json"
          output-sarif: ".byte-gauge/byte-gauge.sarif"
          output-sbom: ".byte-gauge/byte-gauge.cdx.json"
          post-pr-comment: "true"

      - name: Restore previous API Contract Snapshot baseline
        uses: actions/cache/restore@v4
        with:
          path: .specter/baseline-snapshot.json
          key: specter-baseline-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            specter-baseline-${{ github.ref_name }}-
            specter-baseline-main-
            specter-baseline-master-

      - name: Run Specter Self-Audit (Markdown + JSON + SARIF 2.1.0 + CycloneDX 1.5 SBOM)
        id: self-audit
        env:
          COMMIT_MSG: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          ./target/release/specter \
            --head-dir . \
            --baseline-json .specter/baseline-snapshot.json \
            --save-snapshot .specter/current-snapshot.json \
            --commit-message "$COMMIT_MSG" \
            --fail-on-trojan \
            --output-json .specter/current-audit.json \
            --output-sarif .specter/specter.sarif \
            --output-sbom .specter/specter.cdx.json \
            --output-markdown .specter/sticky-comment.md
          cp .specter/current-snapshot.json .specter/baseline-snapshot.json

      - name: Post or Update PR Sticky Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          if [ -f ".specter/sticky-comment.md" ] && [ -n "$PR_NUM" ]; then
            EXISTING_ID=$(gh api "repos/${REPO_FULL}/issues/${PR_NUM}/comments" \
              --jq '.[] | select(.body | contains("<!-- glastor-specter-sticky-comment -->")) | .id' | head -n 1 || true)
            if [ -n "$EXISTING_ID" ]; then
              gh api -X PATCH "repos/${REPO_FULL}/issues/comments/${EXISTING_ID}" \
                -F body=@.specter/sticky-comment.md >/dev/null 2>&1 || true
            else
              gh pr comment "$PR_NUM" --repo "$REPO_FULL" --body-file .specter/sticky-comment.md >/dev/null 2>&1 || true
            fi
          fi

      - name: Upload SARIF 2.1.0 report to GitHub Security (Code Scanning)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: .specter/specter.sarif
          category: specter-api-contract-audit

      - name: Update baseline snapshot cache on main/master
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: actions/cache/save@v4
        with:
          path: .specter/baseline-snapshot.json
          key: specter-baseline-${{ github.ref_name }}-${{ github.sha }}
        env:
          BASELINE_PREP: ${{ steps.self-audit.outputs.status }}

      - name: Upload JSON, SARIF & CycloneDX SBOM Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: specter-telemetry
          path: |
            .specter/current-audit.json
            .specter/current-snapshot.json
            .specter/specter.sarif
            .specter/specter.cdx.json
            .byte-gauge/byte-gauge-audit.json
            .byte-gauge/byte-gauge.sarif
            .byte-gauge/byte-gauge.cdx.json
          retention-days: 14

  # Dogfooding del ecosistema GLASTOR® Core con glastor-core/nemesis
  nemesis-devsecops:
    name: 🛡️ GLASTOR® Nemesis DevSecOps Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GLASTOR® Nemesis SAST & IaC Security Gate
        uses: glastor-core/nemesis@v1
        continue-on-error: true

