[package]
name = "specter-cli"
version = "0.2.0"
edition = "2024"
authors = ["Andrés Antonio Cardoso <ventas@glastor.es>"]
description = "GLASTOR® Core — Zero-Compiler Polyglot AST API Contract Differ, Trojan Breaking-Change Detector & Mathematical SemVer Gatekeeper for GitHub Actions (complements @glastor-core/vortex, @glastor-core/byte-gauge & @glastor-core/medusa)"
homepage = "https://glastor.es"
repository = "https://github.com/glastor-core/specter"
documentation = "https://docs.rs/specter-cli"
license = "MIT"
keywords = ["github-actions", "semver", "api-diff", "devsecops", "glastor-core"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[[bin]]
name = "specter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
